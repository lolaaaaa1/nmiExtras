<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback - Beyond the Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="strip" id="eventStrip">Nationwide Medical Insurance &nbsp;&middot;&nbsp; Sept 27, 2025 &nbsp;&middot;&nbsp; Safari Valley, Adukrom</div>

  <div class="nav">
    <div class="nav-inner">
      <a class="nav-mark" href="index.html" style="text-decoration:none;">Beyond the Desk<span class="dot">.</span></a>
      <div class="nav-right">
        <a class="profile-btn" href="index.html">Home</a>
      </div>
    </div>
  </div>

  <div class="wrap">

    <div class="hero" style="padding-bottom: 10px;">
      <h1 class="hero-title" style="font-size: clamp(28px, 6vw, 46px);">Feedback</h1>
      <p class="hero-sub">Tell us how the trip went - anonymous, no sign-in needed</p>
    </div>

    <div style="margin: 20px 0 40px;">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSdholuSc41fo4Mt54bFnHo1hlen8jnSkBYYtpeZ_Ev60VkqBQ/viewform?embedded=true"
        width="100%" height="900" frameborder="0" style="border:none; border-radius:8px;">
        Loading…
      </iframe>
    </div>

    <div class="foot">Have fun</div>

  </div>

  <div id="toast"></div>

  <script src="assets/app.js"></script>
  <script>
    (() => {
      const { loadCsv } = window.BTD;
      loadCsv('data/2026/event.csv').then((cached) => {
        const row = cached.rows[0] || {};
        if (row.company) {
          document.getElementById('eventStrip').textContent =
            `${row.company}  ·  ${row.date}  ·  ${row.location}`;
        }
      });
    })();
  </script>
</body>
</html>
